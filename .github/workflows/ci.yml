name: CI
on: push

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - run: yarn install

      - run: yarn typecheck
      - run: yarn lint

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A called workflow cannot get more permissions than its caller, and OIDC needs id-token.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
