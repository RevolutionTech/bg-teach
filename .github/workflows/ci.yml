name: CI
on: push

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - run: yarn typecheck
      - run: yarn lint
      - run: yarn build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A called workflow cannot get more permissions than its caller, and OIDC needs id-token.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
